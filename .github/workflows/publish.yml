name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: opencore-linux-amd64
            isPublisher: false

          - goos: darwin
            goarch: amd64
            artifact: opencore-darwin-amd64
            isPublisher: false

          - goos: darwin
            goarch: arm64
            artifact: opencore-darwin-arm64
            isPublisher: false

          - goos: windows
            goarch: amd64
            artifact: opencore-windows-amd64.exe
            isPublisher: true

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.5"

      - name: Go tests
        if: ${{ matrix.isPublisher }}
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X main.version=${{ github.ref_name }}" -o "${{ matrix.artifact }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Setup Node
        if: ${{ matrix.isPublisher }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Update package version
        if: ${{ matrix.isPublisher }}
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Resolve release channel
        if: ${{ matrix.isPublisher }}
        id: channel
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM (Trusted Publisher)
        if: ${{ matrix.isPublisher }}
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public --provenance --tag "${{ steps.channel.outputs.channel }}"

      - name: Download all artifacts
        if: ${{ matrix.isPublisher }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./artifacts

      - name: Prepare release assets
        if: ${{ matrix.isPublisher }}
        shell: bash
        run: |
          mkdir -p release
          find ./artifacts -type f -maxdepth 2 -exec cp {} ./release/ \;
          ls -lah ./release/

      - name: Create GitHub Release
        if: ${{ matrix.isPublisher }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ./release/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body_path: RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
