name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install pnpm
        run: npm install --global pnpm@10.33.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag is on a release branch
        run: |
          git fetch origin develop master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            exit 0
          fi
          echo "Tag commit $GITHUB_SHA is not contained in develop or master."
          exit 1

      - name: Run release preflight
        run: pnpm release:check -- "${{ github.ref_name }}"

      - name: Build binaries
        run: bash scripts/build-all.sh "${{ github.ref_name }}"

      - name: Prepare platform packages
        run: bash scripts/prepare-npm-packages.sh build

      - name: Pack npm packages
        run: |
          mkdir -p dist/npm
          npm pack --pack-destination dist/npm
          for package_dir in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64 npm/win32-x64; do
            npm pack "./$package_dir" --pack-destination dist/npm
          done

      - name: Smoke test npm tarballs
        run: pnpm test:npm-smoke

      - name: Resolve release channel
        id: channel
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish packages idempotently
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          publish_if_missing() {
            package_dir=$1
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published."
            else
              (cd "$package_dir" && npm publish --access public --provenance --tag "$CHANNEL")
            fi
          }
          for package_dir in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64 npm/win32-x64; do
            publish_if_missing "$package_dir"
          done
          publish_if_missing .

      - name: Generate checksums
        run: (cd build && sha256sum opencore-* > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body_path: RELEASE.md
