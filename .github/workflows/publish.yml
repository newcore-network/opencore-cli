name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.5"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run Go tests
        run: go test ./...

      - name: Run Node tests
        run: npm test

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            artifact="opencore-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then artifact="${artifact}.exe"; fi
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o "build/${artifact}" .
          done

      - name: Update package versions from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION.replace(/^v/, "");
            const packageDirs = [".", "npm/linux-x64", "npm/linux-arm64", "npm/darwin-x64", "npm/darwin-arm64", "npm/win32-x64"];
            const optionalDependencies = Object.fromEntries(packageDirs.slice(1).map((dir) => {
              const pkg = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
              return [pkg.name, version];
            }));
            for (const dir of packageDirs) {
              const file = `${dir}/package.json`;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              if (dir === ".") pkg.optionalDependencies = optionalDependencies;
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            }
          '

      - name: Prepare platform packages
        run: bash scripts/prepare-npm-packages.sh build

      - name: Validate npm packages
        run: |
          mkdir -p dist/npm
          npm pack --pack-destination dist/npm
          for package_dir in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64 npm/win32-x64; do
            (cd "$package_dir" && npm pack --pack-destination ../../dist/npm)
          done
          find dist/npm -name '*.tgz' -print

      - name: Resolve release channel
        id: channel
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform packages
        run: |
          for package_dir in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64 npm/win32-x64; do
            (cd "$package_dir" && npm publish --access public --provenance --tag "${{ steps.channel.outputs.channel }}")
          done

      - name: Publish main package
        run: npm publish --access public --provenance --tag "${{ steps.channel.outputs.channel }}"

      - name: Generate checksums
        run: |
          (cd build && sha256sum opencore-* > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body_path: RELEASE.md
